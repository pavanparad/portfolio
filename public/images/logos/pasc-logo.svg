    <rect x="14" y="10" width="40" height="40" rx="8" transform="rotate(45 34 30)" stroke="#0284C7" stroke-width="2.5" fill="#0284C7" fill-opacity="0.12"/>
    <circle cx="34" cy="30" r="8" fill="#0284C7"/>
    <circle cx="34" cy="30" r="4" fill="#F6F1E9"/>
