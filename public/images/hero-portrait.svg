<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="lavenderGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#C4A7FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#DCCBFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5F0FA" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Grayscale Studio Lighting Filter -->
    <filter id="cinematicBw" x="-10%" y="-10%" width="120%" height="120%">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.1" intercept="-0.05"/>
        <feFuncG type="linear" slope="1.1" intercept="-0.05"/>
        <feFuncB type="linear" slope="1.1" intercept="-0.05"/>
      </feComponentTransfer>
    </filter>

    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221E2C"/>
      <stop offset="50%" stop-color="#14121A"/>
      <stop offset="100%" stop-color="#0B0910"/>
    </linearGradient>

    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0C8DF"/>
      <stop offset="60%" stop-color="#A59BB6"/>
      <stop offset="100%" stop-color="#706583"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2838"/>
      <stop offset="100%" stop-color="#110E17"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A88BEA" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Portrait -->
  <circle cx="300" cy="380" r="260" fill="url(#lavenderGlow)"/>

  <!-- Studio Silhouette / High-Fashion Creative Director Portrait -->
  <g id="portrait-figure">
    <!-- Torso / Sleek Oversized Jacket -->
    <path d="M120 750 C120 580 180 520 220 500 C240 490 260 485 300 485 C340 485 360 490 380 500 C420 520 480 580 480 750 Z" fill="url(#jacketGrad)"/>
    
    <!-- Jacket Lapels & Collar -->
    <path d="M220 500 L280 620 L300 750 L320 620 L380 500 L320 490 L300 520 L280 490 Z" fill="#2E283D" opacity="0.6"/>
    <path d="M280 490 L300 540 L320 490 Z" fill="#4B3F63" opacity="0.4"/>
    
    <!-- Neck -->
    <path d="M260 430 L260 500 C280 515 320 515 340 500 L340 430 Z" fill="url(#skinTone)"/>
    <!-- Neck Shadow -->
    <path d="M260 475 C280 495 320 495 340 475 L340 500 C320 515 280 515 260 500 Z" fill="#584C6D" opacity="0.6"/>

    <!-- Head & Jawline -->
    <path d="M225 320 C220 395 245 455 300 460 C355 455 380 395 375 320 C375 240 355 210 300 210 C245 210 225 240 225 320 Z" fill="url(#skinTone)"/>
    
    <!-- Hair Volume (Modern textured crop / quiff) -->
    <path d="M210 290 C205 230 230 155 300 150 C370 155 395 220 390 280 C375 250 350 240 325 245 C300 235 270 240 250 255 C230 265 220 280 210 290 Z" fill="url(#hairGrad)"/>
    
    <!-- Stylish Creative Spectacles / Frames -->
    <rect x="235" y="300" width="55" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="310" y="300" width="55" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="290" y1="316" x2="310" y2="316" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="225" y1="315" x2="235" y2="315" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="365" y1="315" x2="375" y2="315" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Lens Sheen -->
    <rect x="238" y="303" width="49" height="34" rx="6" fill="url(#glassGrad)"/>
    <rect x="313" y="303" width="49" height="34" rx="6" fill="url(#glassGrad)"/>
    <line x1="245" y1="310" x2="275" y2="330" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="320" y1="310" x2="350" y2="330" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Nose & Mouth Details (Minimal Editorial Aesthetic) -->
    <path d="M296 335 L296 360 L304 360" stroke="#685B7E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M285 395 C295 400 305 400 315 395" stroke="#524566" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Subtle Facial Stubble / Beard Line -->
    <path d="M245 365 C255 425 285 445 300 445 C315 445 345 425 355 365 C345 410 320 430 300 430 C280 430 255 410 245 365 Z" fill="#3D344B" opacity="0.45"/>
  </g>

  <!-- Editorial Film Metadata / Overlay Accents -->
  <g opacity="0.65">
    <text x="35" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#77717F" letter-spacing="2">REC [●] 24.00 FPS</text>
    <text x="35" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A88BEA" letter-spacing="1">ISO 800 • 35MM T1.5</text>
    
    <text x="565" y="60" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#77717F" letter-spacing="2">PORTRAIT_ID: MPC_01</text>
    <text x="565" y="80" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#17151D" font-weight="bold" letter-spacing="1">PAVAN / VIDEO DIRECTOR</text>
  </g>

  <!-- Viewfinder Frame Corner Brackets -->
  <path d="M30 40 L50 40 M30 40 L30 60" stroke="#A88BEA" stroke-width="2" stroke-linecap="round"/>
  <path d="M570 40 L550 40 M570 40 L570 60" stroke="#A88BEA" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 710 L50 710 M30 710 L30 690" stroke="#A88BEA" stroke-width="2" stroke-linecap="round"/>
  <path d="M570 710 L550 710 M570 710 L570 690" stroke="#A88BEA" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Crosshair Target -->
  <circle cx="300" cy="375" r="14" stroke="#A88BEA" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="300" y1="355" x2="300" y2="395" stroke="#A88BEA" stroke-width="1" opacity="0.4"/>
  <line x1="280" y1="375" x2="320" y2="375" stroke="#A88BEA" stroke-width="1" opacity="0.4"/>
</svg>
