    <text x="60" y="95" font-family="'JetBrains Mono', monospace" font-size="12" fill="#DCCCF5" letter-spacing="1">EVENT FILM &amp; SOCIAL CONTENT • PASC</text>

    <text x="1140" y="70" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" fill="#DCCCF5" letter-spacing="2">REC ● 24.00 FPS</text>
