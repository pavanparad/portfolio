<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <radialGradient id="pulzionGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#A88BEA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#17151B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
