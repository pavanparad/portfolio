<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <radialGradient id="addictionGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8964DE" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#C9A45C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#17151B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8964DE" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="gridAddiction" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A88BEA" stroke-width="0.8" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Dark Charcoal Base -->
  <rect width="800" height="1000" fill="#17151B"/>
  <rect width="800" height="1000" fill="url(#gridAddiction)"/>
  <circle cx="400" cy="460" r="380" fill="url(#addictionGlow)"/>

  <!-- Dynamic Festival Stage Beams -->
  <polygon points="400,100 150,900 650,900" fill="url(#beamGrad)" opacity="0.25"/>
  <line x1="400" y1="100" x2="120" y2="880" stroke="#C9A45C" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="400" y1="100" x2="680" y2="880" stroke="#C9A45C" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Top Timecode & Metadata HUD -->
  <g opacity="0.9">
    <text x="45" y="65" font-family="'JetBrains Mono', monospace" font-size="13" fill="#C9A45C" letter-spacing="2">02 // FESTIVAL COVERAGE</text>
    <text x="45" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DCCCF5" letter-spacing="1">EVENT COVERAGE &amp; CREATIVE CONTENT</text>

    <text x="755" y="65" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" fill="#DCCCF5" letter-spacing="2">PICT CAMPUS • 2026</text>
    <text x="755" y="88" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C9A45C" letter-spacing="1">ROLE: CONTENT LEAD</text>
  </g>

  <!-- Viewfinder Corner Accents -->
  <path d="M35 45 L70 45 M35 45 L35 80" stroke="#C9A45C" stroke-width="2"/>
  <path d="M765 45 L730 45 M765 45 L765 80" stroke="#C9A45C" stroke-width="2"/>
  <path d="M35 955 L70 955 M35 955 L35 920" stroke="#C9A45C" stroke-width="2"/>
  <path d="M765 955 L730 955 M765 955 L765 920" stroke="#C9A45C" stroke-width="2"/>

  <!-- Center Stage Spotlights Circle Graphic -->
  <circle cx="400" cy="420" r="140" stroke="#8964DE" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="400" cy="420" r="180" stroke="#C9A45C" stroke-width="0.8" opacity="0.3"/>

  <!-- Central Title Lockup -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Big Bold Title -->
    <text y="-20" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="54" fill="#F6F1E9" letter-spacing="-1">
      ADDICTION’26
    </text>
    
    <!-- Subtitle in Serif Italic -->
    <text y="24" font-family="'Playfair Display', serif" font-style="italic" font-size="22" fill="#C9A45C">
      PICT Annual Cultural Festival
    </text>

    <!-- Role Sub-tag -->
    <text y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#DCCCF5" letter-spacing="2">
      CONTENT LEAD • AFTERMOVIE &amp; HIGHLIGHTS
    </text>

    <!-- Audio Spectrum Bars Graphic -->
    <g transform="translate(-140, 95)" fill="#A88BEA" opacity="0.8">
      <rect x="0" y="14" width="4" height="24" rx="2"/>
      <rect x="12" y="6" width="4" height="40" rx="2" fill="#C9A45C"/>
      <rect x="24" y="18" width="4" height="16" rx="2"/>
      <rect x="36" y="2" width="4" height="48" rx="2" fill="#C9A45C"/>
      <rect x="48" y="10" width="4" height="32" rx="2"/>
      <rect x="60" y="20" width="4" height="12" rx="2"/>
      <rect x="72" y="4" width="4" height="44" rx="2" fill="#C9A45C"/>
      <rect x="84" y="12" width="4" height="28" rx="2"/>
      <rect x="96" y="2" width="4" height="48" rx="2" fill="#C9A45C"/>
      <rect x="108" y="8" width="4" height="36" rx="2"/>
      <rect x="120" y="16" width="4" height="20" rx="2"/>
      <rect x="132" y="4" width="4" height="44" rx="2" fill="#C9A45C"/>
      <rect x="144" y="0" width="4" height="52" rx="2" fill="#C9A45C"/>
      <rect x="156" y="10" width="4" height="32" rx="2"/>
      <rect x="168" y="4" width="4" height="44" rx="2" fill="#C9A45C"/>
      <rect x="180" y="14" width="4" height="24" rx="2"/>
      <rect x="192" y="2" width="4" height="48" rx="2" fill="#C9A45C"/>
      <rect x="204" y="12" width="4" height="28" rx="2"/>
      <rect x="216" y="4" width="4" height="44" rx="2" fill="#C9A45C"/>
      <rect x="228" y="20" width="4" height="12" rx="2"/>
      <rect x="240" y="10" width="4" height="32" rx="2"/>
      <rect x="252" y="6" width="4" height="40" rx="2" fill="#C9A45C"/>
      <rect x="264" y="14" width="4" height="24" rx="2"/>
      <rect x="276" y="8" width="4" height="36" rx="2"/>
    </g>
  </g>

  <!-- Bottom Elegant Status Bar -->
  <g transform="translate(45, 920)">
    <rect width="280" height="28" rx="14" fill="#0E0C12" stroke="#C9A45C" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#C9A45C"/>
    <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F6F1E9" letter-spacing="1">PROJECT MEDIA PLACEHOLDER</text>
  </g>
  
  <text x="755" y="938" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#77717F" letter-spacing="1">
    ASSET READY FOR VIDEO LINK
  </text>
</svg>